{% extends "base.html" %}
{% block titulo %}{{ titulo }} · {{ sitio.nombre }}{% endblock %}

{% block contenido %}
<p class="migas"><a href="{% url 'evento:gestion' %}">Administración</a> &rsaquo; {{ titulo }}</p>
<h2>{{ titulo }}</h2>
<form method="post" enctype="multipart/form-data" class="formulario">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primario">Guardar</button>
</form>
<p><a href="{% url 'evento:gestion' %}">Volver</a></p>
{% endblock %}
