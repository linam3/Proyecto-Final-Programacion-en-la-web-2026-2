{% extends "base.html" %}
{% block titulo %}Registro · UFEST{% endblock %}

{% block contenido %}
<h2>Crear cuenta</h2>
<form method="post" class="formulario">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primario">Registrarme</button>
</form>
<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
